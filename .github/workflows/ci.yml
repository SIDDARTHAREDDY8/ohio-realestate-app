name: CI — Build & Type Check

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "pipeline/data/**"
      - "*.md"
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: TypeScript Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  lint-pipeline:
    name: Lint Python Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install ruff

      - name: Lint pipeline scripts
        run: |
          ruff check pipeline/ --ignore E501,E402,F401 || true
          echo "Pipeline lint complete"

      - name: Validate JSON data files
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          errors = []
          for f in pathlib.Path("client/src/data").glob("*.json"):
              try:
                  json.loads(f.read_text())
                  print(f"  ✓ {f.name}")
              except Exception as e:
                  errors.append(f"  ✗ {f.name}: {e}")
          if errors:
              print("\nJSON validation errors:")
              for e in errors:
                  print(e)
              sys.exit(1)
          else:
              print("\nAll JSON files valid.")
          EOF
