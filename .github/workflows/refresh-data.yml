name: Monthly Data Refresh

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  # Run on the 1st of every month at 06:00 UTC
  schedule:
    - cron: "0 6 1 * *"

  # Allow manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:
    inputs:
      skip_redfin:
        description: "Skip Redfin download (large file, ~1.5 GB)"
        required: false
        default: "false"
        type: boolean
      skip_models:
        description: "Skip ML model re-training (faster run)"
        required: false
        default: "false"
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
# Permissions — contents to push refreshed JSON back to the repo,
# actions to dispatch the Pages deploy afterwards
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write
  actions: write

jobs:
  refresh:
    name: Refresh Data & Retrain Models
    runs-on: ubuntu-latest
    timeout-minutes: 90          # Redfin download can take ~20 min on GitHub runners

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      # ── 4. Cache raw data (Redfin is large — avoid re-downloading every run)
      # Keyed by month: re-runs within a month hit the cache; a new month
      # (i.e. the scheduled refresh) downloads fresh data.
      - name: Compute cache month
        id: cache-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache raw data files
        uses: actions/cache@v4
        with:
          path: pipeline/data/raw
          key: raw-data-${{ runner.os }}-${{ steps.cache-month.outputs.month }}
          restore-keys: |
            raw-data-${{ runner.os }}-

      # ── 5. Run the full pipeline ───────────────────────────────────────────
      - name: Run ETL + ML pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          python pipeline/run_pipeline.py \
            ${{ github.event.inputs.skip_redfin == 'true' && '--skip-redfin' || '' }} \
            ${{ github.event.inputs.skip_models == 'true' && '--skip-models' || '' }}

      # Surface the failure cause directly in the run page — the log tail
      # shows which pipeline step failed and its traceback.
      - name: Show pipeline log on failure
        if: failure()
        run: |
          echo "=== last 150 lines of pipeline.log ==="
          tail -n 150 pipeline/pipeline.log || echo "(no pipeline.log found)"

      # ── 6. Verify output ───────────────────────────────────────────────────
      - name: Verify frontend data files
        run: |
          echo "=== Frontend data files ==="
          ls -lh client/src/data/
          echo ""
          echo "=== Record counts ==="
          python - <<'EOF'
          import json, pathlib
          data_dir = pathlib.Path("client/src/data")
          for f in sorted(data_dir.glob("*.json")):
              try:
                  d = json.loads(f.read_text())
                  n = len(d) if isinstance(d, list) else "dict"
                  print(f"  {f.name}: {n} records")
              except Exception as e:
                  print(f"  {f.name}: ERROR — {e}")
          EOF

      # ── 7. Commit refreshed data back to the repo ──────────────────────────
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add client/src/data/
          git add pipeline/pipeline.log || true

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No data changes detected — skipping commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M UTC")
            git commit -m "data: auto-refresh ${TIMESTAMP}"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "✓ Refreshed data committed and pushed."
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # Pages deploy must be dispatched explicitly to publish the fresh data.
      - name: Trigger GitHub Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      # ── 8. Upload pipeline artifacts for debugging ─────────────────────────
      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_number }}
          path: pipeline/pipeline.log
          retention-days: 30

      # ── 9. Post run summary ────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib, datetime

          meta_path = pathlib.Path("client/src/data/pipeline_meta.json")
          kpi_path  = pathlib.Path("client/src/data/kpis.json")

          summary = ["## Ohio RE Data Refresh Summary\n"]

          if meta_path.exists():
              meta = json.loads(meta_path.read_text())
              summary.append(f"**Last refresh:** {meta.get('last_refresh', 'unknown')}")
              summary.append(f"**Counties covered:** {meta.get('counties_covered', 88)}")
              summary.append(f"**Data sources:** {', '.join(meta.get('data_sources', []))}\n")

          if kpi_path.exists():
              kpis = json.loads(kpi_path.read_text())
              sw = kpis.get("statewide", {})
              summary.append("### Key Metrics (Ohio Statewide)")
              summary.append(f"| Metric | Value |")
              summary.append(f"|--------|-------|")
              summary.append(f"| Avg Home Value | ${sw.get('avg_home_value', 0):,.0f} |")
              summary.append(f"| Avg Rent | ${sw.get('avg_rent', 0):,.0f}/mo |")
              summary.append(f"| Homeownership Rate | {sw.get('avg_homeownership_rate', 0):.1f}% |")
              summary.append(f"| Median Listing Price | ${kpis.get('latest_listing_price', 0):,.0f} |")
              summary.append(f"| 30-Yr Mortgage Rate | {kpis.get('mortgage_rate_30yr', 0):.2f}% |")
              summary.append(f"| Unemployment Rate | {kpis.get('unemployment_rate', 0):.1f}% |")

          print("\n".join(summary))
          with open("$GITHUB_STEP_SUMMARY", "a") as f:
              f.write("\n".join(summary))
          EOF
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
